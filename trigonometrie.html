<style>
:root{
  --bg:#F5F3EC; --surface:#FFFFFF; --surface-2:#EEF2F8; --ink:#1D2733; --muted:#5B6776;
  --line:#D9DEE6; --accent:#2457A6; --accent-ink:#FFFFFF; --accent-soft:#E3ECFA;
  --ok:#2E7D4F; --ok-soft:#E4F2E9; --ko:#B3412F; --ko-soft:#F8E6E2; --hl:#FFF1B8;
  --sin:#B3412F; --axis:#8592A3; --shadow:0 10px 30px rgba(29,39,51,.08);
}
@media (prefers-color-scheme: dark){
  :root{
    --bg:#11161D; --surface:#19212B; --surface-2:#202A36; --ink:#E6EAEF; --muted:#9AA6B4;
    --line:#2D3946; --accent:#7EA6EE; --accent-ink:#0E1620; --accent-soft:#22324A;
    --ok:#6FCB94; --ok-soft:#1C3328; --ko:#F08C7A; --ko-soft:#3A221E; --hl:#4A4220;
    --sin:#F08C7A; --axis:#6C7A8B; --shadow:0 10px 30px rgba(0,0,0,.35);
  }
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:'Atkinson Hyperlegible',system-ui,sans-serif;
  font-size:16px;line-height:1.55;padding:28px 16px 64px}
.wrap{max-width:760px;margin:0 auto}
header{margin-bottom:18px}
.eyebrow{font-size:13px;color:var(--muted);letter-spacing:.03em}
.eyebrow a{color:var(--accent)}
h1{font-family:'Fraunces',serif;font-weight:700;font-size:clamp(28px,6vw,40px);line-height:1.1;margin:4px 0 6px}
.sub{color:var(--muted);font-size:15px}
nav.tabs{display:flex;gap:6px;flex-wrap:wrap;margin:18px 0 22px;border-bottom:1px solid var(--line);padding-bottom:10px}
.tab{border:1px solid var(--line);background:var(--surface);color:var(--ink);font:inherit;font-size:15px;
  padding:8px 16px;border-radius:999px;cursor:pointer;text-decoration:none}
.tab[aria-selected="true"]{background:var(--accent);color:var(--accent-ink);border-color:var(--accent);font-weight:700}
a.tab.ds{border-style:dashed;color:var(--accent)}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:20px;box-shadow:var(--shadow);margin-bottom:16px}
h2{font-family:'Fraunces',serif;font-weight:600;font-size:22px;margin:0 0 10px}

.formula{background:var(--surface-2);border-left:4px solid var(--accent);border-radius:8px;padding:10px 14px;
  margin:10px 0;font-size:17px;overflow-x:auto}
.warn{background:var(--hl);border-radius:8px;padding:10px 14px;margin:10px 0;font-size:15px}
.muted{color:var(--muted)}

/* fraction */
.fr{display:inline-flex;flex-direction:column;vertical-align:middle;text-align:center;font-size:.92em;line-height:1.1;margin:0 2px}
.fr>span:first-child{border-bottom:1.3px solid currentColor;padding:0 3px}
.fr>span:last-child{padding:0 3px}

table.t th{background:var(--surface-2);font-weight:700}

svg .circ{stroke:var(--ink);stroke-width:1.6;fill:none}
svg .grid{stroke:var(--line);stroke-width:1}
svg .lbl{fill:var(--muted);font-size:12px}
svg .lblb{fill:var(--ink);font-size:14px;font-weight:700}
svg .cosc{stroke:var(--accent);stroke-width:2.6;fill:none}
svg .sinc{stroke:var(--sin);stroke-width:2.6;fill:none}

.center{text-align:center}
/* flashcards */
.flash{perspective:1200px;min-height:250px;cursor:pointer;margin-bottom:12px}
.flash-in{position:relative;min-height:250px;transition:transform .5s cubic-bezier(.4,.2,.2,1);transform-style:preserve-3d}
.flash.flipped .flash-in{transform:rotateY(180deg)}
.face{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;border-radius:14px;
  border:1px solid var(--line);background:var(--surface);box-shadow:var(--shadow);padding:28px 24px;

.opt{display:block;width:100%;text-align:left;border:1.5px solid var(--line);background:var(--surface);color:var(--ink);
  font:inherit;font-size:17px;padding:11px 14px;border-radius:10px;margin:8px 0;cursor:pointer}
.opt:hover:not(:disabled){border-color:var(--accent)}
.opt.good{background:var(--ok-soft);border-color:var(--ok);font-weight:700}
.opt.bad{background:var(--ko-soft);border-color:var(--ko);font-weight:700}
.opt:disabled{cursor:default}
.fb{border-radius:10px;padding:10px 14px;margin-top:10px;font-size:15.5px}
.fb.good{background:var(--ok-soft)} .fb.bad{background:var(--ko-soft)}
.fb b.t{display:block}
.progress{font-size:14px;color:var(--muted);margin-bottom:8px}
.big{font-family:'Fraunces',serif;font-size:52px;font-weight:700;color:var(--accent);margin:4px 0}
.qtxt{font-size:18px;margin-top:0}
footer{margin-top:30px;font-size:13px;color:var(--muted);text-align:center}

@media (max-width:560px){ .card{padding:16px 14px} .face p{font-size:17px} }

<script>
/* ---------- helpers ---------- */
const $ = s => document.querySelector(s);
const pick = a => a[Math.floor(Math.random() * a.length)];
const rnd = (a, b) => a + Math.floor(Math.random() * (b - a + 1));
const shuffle = a => { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
const store = {
  get(k, d){ try { const v = localStorage.getItem('trigo_' + k); return v === null ? d : JSON.parse(v); } catch(e){ return d; } },
  set(k, v){ try { localStorage.setItem('trigo_' + k, JSON.stringify(v)); } catch(e){} }
};
const gcd = (a, b) => { a = Math.abs(a); b = Math.abs(b); while (b) [a, b] = [b, a % b]; return a || 1; };
const F = (n, d) => `<span class="fr"><span>${n}</span><span>${d}</span></span>`;
const PI = Math.PI, R2 = Math.SQRT2 / 2, R3 = Math.sqrt(3) / 2;
/* k/d × π, écrit proprement */
function pis(k, d){
  if (k === 0) return '0';
  if (d < 0) { d = -d; k = -k; }
  const g = gcd(k, d); k /= g; d /= g;
  const s = k < 0 ? '−' : '', a = Math.abs(k), n = (a === 1 ? '' : a) + 'π';
  return d === 1 ? s + n : s + F(n, d);
}
/* mesure principale de kπ/d : renvoie [m, d] avec m/d ∈ ]−1 ; 1] */
function princ(k, d){
  const g = gcd(k, d); k /= g; d /= g;
  let m = ((k % (2 * d)) + 2 * d) % (2 * d);
  if (m > d) m -= 2 * d;
  return [m, d];
}
/* valeur exacte d'un cos / sin remarquable */
function ex(v){
  const a = Math.abs(v), s = v < -1e-9 ? '−' : '', e = x => Math.abs(a - x) < 1e-9;
  if (a < 1e-9) return '0';
  if (e(.5)) return s + F('1', '2');
  if (e(R2)) return s + F('√2', '2');
  if (e(R3)) return s + F('√3', '2');
  if (e(1)) return s + '1';
  return '≈ ' + v.toFixed(3).replace('.', ',');
}
const ALLV = [-1, -R3, -R2, -.5, 0, .5, R2, R3, 1];
const cosF = t => Math.cos(t), sinF = t => Math.sin(t);
/* angles remarquables = multiples de π/12 dont le numérateur est multiple de 2 ou 3 */
const REM = [0, 2, 3, 4, 6, 8, 9, 10, 12, 14, 15, 16, 18, 20, 21, 22];
const tw = n => pis(n, 12);

/* ---------- SVG : cercle ---------- */
const CX = 160, CY = 160, RR = 118;
const P = t => [CX + RR * Math.cos(t), CY - RR * Math.sin(t)];
function circleBase(extra = ''){
  return `<svg viewBox="0 0 320 320" role="img" aria-label="Cercle trigonométrique">
    <line class="ax" x1="20" y1="${CY}" x2="300" y2="${CY}"/><line class="ax" x1="${CX}" y1="20" x2="${CX}" y2="300"/>
    <circle class="circ" cx="${CX}" cy="${CY}" r="${RR}"/>
    <text class="lbl" x="${CX + RR + 4}" y="${CY + 15}">1</text><text class="lbl" x="${CX - RR - 18}" y="${CY + 15}">−1</text>
    <text class="lbl" x="${CX + 6}" y="${CY - RR - 4}">1</text><text class="lbl" x="${CX + 6}" y="${CY + RR + 14}">−1</text>
    <text class="lbl" x="${CX - 14}" y="${CY + 15}">O</text>${extra}</svg>`;
}

/* ---------- FICHE ---------- */
function curvesSVG(){
  const W = 640, H = 200, x0 = 20, x1 = 620, ym = 100, sy = 70, sx = (x1 - x0) / (4 * PI);
  const X = t => x0 + (t + 2 * PI) * sx, Y = v => ym - v * sy;
  const path = f => { let d = ''; for (let i = 0; i <= 240; i++) { const t = -2 * PI + i * 4 * PI / 240; d += (i ? 'L' : 'M') + X(t).toFixed(1) + ' ' + Y(f(t)).toFixed(1); } return d; };
  let ticks = '';
  for (let k = -4; k <= 4; k++) {
    const x = X(k * PI / 2);
    ticks += `<line class="grid" x1="${x}" y1="${Y(1)}" x2="${x}" y2="${Y(-1)}"/>`;
    if (k) ticks += `<text class="lbl" x="${x}" y="${ym + 16}" text-anchor="middle">${k % 2 ? (k < 0 ? '−' : '') + (Math.abs(k) === 1 ? '' : Math.abs(k)) + 'π/2' : (k < 0 ? '−' : '') + (Math.abs(k) === 2 ? '' : Math.abs(k) / 2) + 'π'}</text>`;
  }
  return `<svg viewBox="0 0 ${W} ${H}" style="width:100%;height:auto" role="img" aria-label="Courbes de cosinus et sinus">
    <line class="grid" x1="${x0}" y1="${Y(1)}" x2="${x1}" y2="${Y(1)}"/><line class="grid" x1="${x0}" y1="${Y(-1)}" x2="${x1}" y2="${Y(-1)}"/>
    ${ticks}<line class="ax" x1="${x0}" y1="${ym}" x2="${x1}" y2="${ym}"/><line class="ax" x1="${X(0)}" y1="10" x2="${X(0)}" y2="190"/>
    <text class="lbl" x="${X(0) + 4}" y="${Y(1) - 4}">1</text><text class="lbl" x="${X(0) + 4}" y="${Y(-1) + 14}">−1</text>
    <path class="cosc" d="${path(cosF)}"/><path class="sinc" d="${path(sinF)}"/>
    <text x="${x1 - 120}" y="22" style="fill:var(--accent);font-weight:700;font-size:14px">— cos</text><text x="${x1 - 60}" y="22" style="fill:var(--sin);font-weight:700;font-size:14px">— sin</text></svg>`;
}
function firstQuadrantSVG(){
  let s = '';
  [[2, 'π/6'], [3, 'π/4'], [4, 'π/3'], [6, 'π/2'], [0, '0'], [12, 'π']].forEach(([n, l]) => {
    const t = n * PI / 12, [x, y] = P(t);
    s += `<circle class="pt" cx="${x}" cy="${y}" r="4"/>`;
    if (n > 0 && n < 6) s += `<line class="dash" x1="${x}" y1="${y}" x2="${x}" y2="${CY}"/><line class="dash" x1="${x}" y1="${y}" x2="${CX}" y2="${y}"/>`;
    const [lx, ly] = [CX + (RR + 18) * Math.cos(t), CY - (RR + 14) * Math.sin(t)];
    s += `<text class="lblb" x="${lx}" y="${ly + 4}" text-anchor="middle">${l}</text>`;
  });
  return `<div class="circlebox">${circleBase(s)}</div>`;
}
function renderFiche(){
  const yt = id => `<a class="vid" href="https://youtu.be/${id}" target="_blank" rel="noopener">▶ Vidéo d'Yvan Monka</a>`;
  $('#view').innerHTML = `
  <div class="card">
    <h2>1. Le cercle trigonométrique et le radian</h2>
    <p>Le <b>cercle trigonométrique</b> est le cercle de centre O et de rayon 1, parcouru dans le <b>sens direct</b> (sens inverse des aiguilles d'une montre).</p>
    <p>On « enroule » la droite des réels autour du cercle : à chaque réel x correspond un unique point M du cercle. Les réels x et x + 2kπ (k entier) donnent le <b>même point</b>, car un tour complet mesure 2π.</p>
    <p>Le <b>radian</b> est l'unité d'angle qui correspond à cette longueur d'arc :</p>
    <div class="formula">180° = π rad &nbsp;&nbsp;⇒&nbsp;&nbsp; angle en rad = angle en degrés × ${F('π', '180')}</div>
    <div class="tablewrap"><table class="t"><tr><th>Degrés</th><td>0°</td><td>30°</td><td>45°</td><td>60°</td><td>90°</td><td>180°</td><td>360°</td></tr>
    <tr><th>Radians</th><td>0</td><td>${pis(1, 6)}</td><td>${pis(1, 4)}</td><td>${pis(1, 3)}</td><td>${pis(1, 2)}</td><td>π</td><td>2π</td></tr></table></div>
    ${yt('-fu9bSBKM00')} · ${yt('Fk_YO30jXn8').replace('Vidéo', 'Placer par enroulement')}
  </div>
  <div class="card">
    <h2>2. Mesure principale</h2>
    <p>Un angle a une infinité de mesures (on peut ajouter des tours de 2π). Sa <b>mesure principale</b> est l'unique mesure comprise dans <b>]−π ; π]</b>.</p>
    <h3>Méthode</h3>
    <p>On ajoute ou on retire des tours de 2π, en écrivant 2π avec le même dénominateur.</p>
    <div class="formula">${pis(17, 6)} = ${F('12π', '6')} + ${F('5π', '6')} = 2π + ${pis(5, 6)} &nbsp;→ mesure principale ${pis(5, 6)}</div>
    <div class="formula">${pis(-13, 4)} = ${pis(-16, 4).replace('4π', '4π')} + ${pis(3, 4)} = −2 × 2π + ${pis(3, 4)} &nbsp;→ mesure principale ${pis(3, 4)}</div>
    ${yt('BODMdi2S3rY')}
  </div>
  <div class="card">
    <h2>3. Cosinus et sinus d'un réel</h2>
    <p>Si M est le point du cercle associé au réel x, alors :</p>
    <div class="formula">M a pour coordonnées ( cos x ; sin x ) &nbsp;: cos x = abscisse, sin x = ordonnée</div>
    <p>Pour tout réel x et tout entier k :</p>
    <div class="formula">−1 ≤ cos x ≤ 1 &nbsp;&nbsp; −1 ≤ sin x ≤ 1<br>cos²x + sin²x = 1<br>cos(x + 2kπ) = cos x &nbsp;&nbsp; sin(x + 2kπ) = sin x</div>
    <div class="warn">cos²x veut dire (cos x)². La formule cos²x + sin²x = 1 vient du théorème de Pythagore dans le cercle de rayon 1.</div>
    <h3>Calculer cos x quand on connaît sin x</h3>
    <p>Exemple : sin x = ${F('3', '5')} et x ∈ [${pis(1, 2)} ; π]. Alors cos²x = 1 − ${F('9', '25')} = ${F('16', '25')}, donc cos x = ${F('4', '5')} ou cos x = −${F('4', '5')}. Comme x ∈ [${pis(1, 2)} ; π], cos x ≤ 0 : <b>cos x = −${F('4', '5')}</b>.</p>
    ${yt('VfzFlEId56A')}
  </div>
  <div class="card">
    <h2>4. Valeurs remarquables</h2>
    <div class="tablewrap"><table class="t"><tr><th>x</th><td>0</td><td>${pis(1, 6)}</td><td>${pis(1, 4)}</td><td>${pis(1, 3)}</td><td>${pis(1, 2)}</td><td>π</td></tr>
    <tr><th>cos x</th><td>1</td><td>${F('√3', '2')}</td><td>${F('√2', '2')}</td><td>${F('1', '2')}</td><td>0</td><td>−1</td></tr>
    <tr><th>sin x</th><td>0</td><td>${F('1', '2')}</td><td>${F('√2', '2')}</td><td>${F('√3', '2')}</td><td>1</td><td>0</td></tr></table></div>
    <div class="warn">Astuce : de 0 à ${pis(1, 2)}, sin x vaut ${F('√0', '2')}, ${F('√1', '2')}, ${F('√2', '2')}, ${F('√3', '2')}, ${F('√4', '2')}. Le cosinus, c'est la même liste à l'envers.</div>
    ${firstQuadrantSVG()}
    <h3>Démonstrations au programme</h3>
    <p><b>sin(${pis(1, 4)}) = ${F('√2', '2')}</b> : le triangle OHM (H projeté de M sur l'axe des abscisses) est rectangle isocèle (un demi-carré), donc OH = HM. Pythagore : OH² + HM² = 1, d'où 2 HM² = 1, HM = ${F('1', '√2')} = ${F('√2', '2')}.</p>
    <p><b>cos(${pis(1, 3)}) = ${F('1', '2')}</b> : le triangle OIM a OI = OM = 1 et un angle de 60° : il est équilatéral. Sa hauteur [MH] tombe au milieu de [OI], donc OH = ${F('1', '2')}. Puis sin²(${pis(1, 3)}) = 1 − ${F('1', '4')} = ${F('3', '4')}, donc sin(${pis(1, 3)}) = ${F('√3', '2')}.</p>
    ${yt('b2-EQupZUp8')} · ${yt('4R1i5Vj72Ls')}
  </div>
  <div class="card">
    <h2>5. Angles associés</h2>
    <p>Ces formules se retrouvent par symétrie sur le cercle : <b>−x</b> symétrique par rapport à l'axe des abscisses, <b>π − x</b> par rapport à l'axe des ordonnées, <b>π + x</b> par rapport à O, <b>${pis(1, 2)} − x</b> par rapport à la droite y = x.</p>
    <div class="tablewrap"><table class="t">
      <tr><th></th><th>−x</th><th>π − x</th><th>π + x</th><th>${pis(1, 2)} − x</th><th>${pis(1, 2)} + x</th></tr>
      <tr><th>cos</th><td>cos x</td><td>−cos x</td><td>−cos x</td><td>sin x</td><td>−sin x</td></tr>
      <tr><th>sin</th><td>−sin x</td><td>sin x</td><td>−sin x</td><td>cos x</td><td>cos x</td></tr></table></div>

/* ---------- CERCLE INTERACTIF ---------- */
let cer = { mode: store.get('cmode', 'explore'), n: store.get('cn', 4), target: null, ok: store.get('cok', 0), tot: store.get('ctot', 0), answered: false };
function explorerSVG(n){
  const t = n * PI / 12, [x, y] = P(t);
  let arc = '';
  const steps = Math.max(12, Math.abs(n) * 4);
  for (let i = 0; i <= steps; i++) { const u = t * i / steps, r = 22 + 5 * Math.abs(u) / (2 * PI); arc += (i ? 'L' : 'M') + (CX + r * Math.cos(u)).toFixed(1) + ' ' + (CY - r * Math.sin(u)).toFixed(1); }
  const marks = REM.map(m => { const [a, b] = P(m * PI / 12); return `<circle cx="${a}" cy="${b}" r="2.5" style="fill:var(--muted)"/>`; }).join('');
  return circleBase(`${marks}
    ${n ? `<path class="arc" d="${arc}"/>` : ''}
    <line class="dash" x1="${x}" y1="${y}" x2="${x}" y2="${CY}"/><line class="dash" x1="${x}" y1="${y}" x2="${CX}" y2="${y}"/>
    <line class="cosc" x1="${CX}" y1="${CY}" x2="${x}" y2="${CY}"/><line class="sinc" x1="${CX}" y1="${CY}" x2="${CX}" y2="${y}"/>
    <line style="stroke:var(--ink);stroke-width:1.3" x1="${CX}" y1="${CY}" x2="${x}" y2="${y}"/>
    <circle class="pt" cx="${x}" cy="${y}" r="6"/><text class="lblb" x="${CX + (RR + 16) * Math.cos(t)}" y="${CY - (RR + 14) * Math.sin(t) + 5}" text-anchor="middle">M</text>`);
}
function newTarget(){
  const d = pick([1, 2, 3, 4, 6, 6, 4, 3]);
  let k;
  do { k = rnd(-5 * d, 5 * d); } while (gcd(k, d) !== 1 || (d === 1 && Math.abs(k) > 5));
  const [m, dd] = princ(k, d);
  cer.target = { k, d, n: (((m * 12 / dd) % 24) + 24) % 24, m, dd };
  cer.answered = false;
}
function renderCercle(){
  const seg = `<div class="row" style="justify-content:center;margin-bottom:12px"><div class="seg">
    <button data-m="explore" aria-pressed="${cer.mode === 'explore'}">Explorer</button>
    <button data-m="place" aria-pressed="${cer.mode === 'place'}">Placer le point</button></div></div>`;
  if (cer.mode === 'explore') {
    const n = cer.n, t = n * PI / 12, [pm, pd] = princ(n, 12);
    $('#view').innerHTML = `<div class="card">${seg}
      <div class="circlebox" id="cb">${explorerSVG(n)}</div>
      <input type="range" id="rg" min="-24" max="24" step="1" value="${n}" aria-label="Angle">
      <div class="row" style="justify-content:center"><button class="btn ghost small" id="m1">− π/12</button><button class="btn ghost small" id="p1">+ π/12</button></div>
      <div class="readout">
        <div><small>Angle x</small><b>${tw(n)}</b> <span class="muted">(${n * 15}°)</span></div>
        <div><small>Mesure principale</small><b>${pis(pm, pd)}</b></div>
        <div class="c"><small>cos x (abscisse)</small><b>${ex(Math.cos(t))}</b></div>
        <div class="s"><small>sin x (ordonnée)</small><b>${ex(Math.sin(t))}</b></div>
      </div>
      <p class="muted" style="font-size:14px;margin-bottom:0">Fais glisser le curseur : le point M tourne sur le cercle. Au-delà d'un tour, il retombe sur les mêmes points (même cos, même sin). Les petits points gris sont les angles remarquables.</p></div>`;
    const set = v => { cer.n = Math.max(-24, Math.min(24, v)); store.set('cn', cer.n); renderCercle(); };
    $('#rg').oninput = e => set(+e.target.value);
    $('#m1').onclick = () => set(cer.n - 1);
    $('#p1').onclick = () => set(cer.n + 1);
  } else {
    if (!cer.target) newTarget();
    const T = cer.target;
    const hits = REM.map(m => { const [a, b] = P(m * PI / 12); return `<circle class="hit" data-n="${m}" cx="${a}" cy="${b}" r="11"/>`; }).join('');
    $('#view').innerHTML = `<div class="card">${seg}
      <p class="center qtxt">Touche le point associé au réel <b style="font-size:22px">${pis(T.k, T.d)}</b></p>
      <div class="circlebox">${circleBase(hits)}</div>
      <div id="cfb"></div>
      <div class="row" style="justify-content:space-between;margin-top:12px"><span class="muted" style="font-size:14px">Réussis : ${cer.ok} / ${cer.tot}</span>
      <button class="btn" id="cn" ${cer.answered ? '' : 'disabled'}>Point suivant</button></div></div>`;
    document.querySelectorAll('.hit').forEach(h => h.onclick = () => {
      if (cer.answered) return;
      cer.answered = true;
      const n = +h.dataset.n, ok = n === T.n;
      cer.tot++; if (ok) cer.ok++;
      store.set('cok', cer.ok); store.set('ctot', cer.tot);
      document.querySelectorAll('.hit').forEach(x => { if (+x.dataset.n === T.n) x.classList.add('good'); else if (x === h) x.classList.add('bad'); });
      const same = T.k === T.m && T.d === T.dd;
      $('#cfb').innerHTML = `<div class="fb ${ok ? 'good' : 'bad'}"><b class="t">${ok ? 'Bravo !' : 'Raté, le bon point est en vert.'}</b>${same ? `${pis(T.k, T.d)} est déjà dans ]−π ; π].` : `Mesure principale : ${pis(T.k, T.d)} = ${pis(T.m, T.dd)} ${(T.k / T.d - T.m / T.dd) > 0 ? '+' : '−'} ${Math.abs(Math.round((T.k / T.d - T.m / T.dd) / 2)) === 1 ? '' : Math.abs(Math.round((T.k / T.d - T.m / T.dd) / 2)) + ' × '}2π.`} On place donc le point de l'angle ${pis(T.m, T.dd)} (${String(Math.round(T.m / T.dd * 180)).replace("-", "−")}°).</div>`;
      $('#cn').disabled = false;
    });
    $('#cn').onclick = () => { newTarget(); renderCercle(); };
  }
  document.querySelectorAll('.seg button').forEach(b => b.onclick = () => { cer.mode = b.dataset.m; store.set('cmode', cer.mode); renderCercle(); });
}

/* ---------- ENTRAÎNEMENT (exercices générés) ---------- */
function build(q, correct, cands, e){
  const seen = new Set([correct]), opts = [correct];
  for (const c of shuffle(cands)) { if (opts.length >= 4) break; if (!seen.has(c)) { seen.add(c); opts.push(c); } }
  const o = shuffle(opts);
  return { q, o, c: o.indexOf(correct), e };
}
function genConv(){
  const deg = pick([30, 45, 60, 90, 120, 135, 150, 210, 225, 240, 270, 300, 315, 330, 20, 36, 72, 10, 15, 75, 105, 18, 40, 160]);
  const near = [deg * 2, deg + 30, deg - 15, 180 - deg, deg + 15, 360 - deg].filter(x => x > 0 && x !== deg && x <= 360);
  if (Math.random() < .5) {
    return build(`Convertir <b>${deg}°</b> en radians.`, pis(deg, 180), [pis(deg, 360), ...near.map(x => pis(x, 180))],
      `${deg} × ${F('π', '180')} = ${F(deg + 'π', '180')} = ${pis(deg, 180)}.`);
  }
  return build(`Convertir <b>${pis(deg, 180)}</b> rad en degrés.`, deg + '°', near.map(x => x + '°'),
    `On remplace π par 180° : ${(() => { const g = gcd(deg, 180), k = deg / g, d = 180 / g; return d === 1 ? k + ' × 180°' : F((k === 1 ? '' : k + ' × ') + '180°', d); })()} = ${deg}°.`);
}
function genPrinc(){
  const d = pick([2, 3, 4, 6, 6, 4, 3]);
  let k;
  do { k = rnd(-8 * d, 8 * d); } while (gcd(k, d) !== 1 || Math.abs(k) <= d);
  const [m] = princ(k, d), t = Math.round((k - m) / (2 * d));
  const cands = [pis(m + (m > 0 ? -2 * d : 2 * d), d), pis(-m, d), pis(m > 0 ? m - d : m + d, d), pis(k - 2 * d * (t > 0 ? t - 1 : t + 1), d), pis(d - m, d), pis(-d - m, d), pis(m + (m > 0 ? -4 * d : 4 * d), d)];
  return build(`Quelle est la mesure principale de <b>${pis(k, d)}</b> ?`, pis(m, d), cands,
    `2π = ${F(2 * d + 'π', d)}. ${pis(k, d)} = ${pis(m, d)} ${t > 0 ? '+' : '−'} ${Math.abs(t) === 1 ? '' : Math.abs(t) + ' × '}2π, et ${pis(m, d)} est bien dans ]−π ; π].`);
}
function genVal(){
  const d = pick([1, 2, 3, 4, 6, 6, 4, 3]);
  let k;
  do { k = rnd(-4 * d, 4 * d); } while (gcd(k, d) !== 1 || (d === 1 && Math.abs(k) > 7));
  const isCos = Math.random() < .5, t = k * PI / d, v = isCos ? Math.cos(t) : Math.sin(t), w = isCos ? Math.sin(t) : Math.cos(t);
  const [m, dd] = princ(k, d);
  const cands = [ex(-v), ex(w), ex(-w), ...ALLV.map(ex)];
  return build(`Valeur exacte de <b>${isCos ? 'cos' : 'sin'}(${pis(k, d)})</b> ?`, ex(v), cands,
    `${(m !== k / gcd(k, d) || dd !== d / gcd(k, d)) ? `Mesure principale : ${pis(m, dd)}. ` : ''}Sur le cercle, le point de ${pis(m, dd)} a pour coordonnées (${ex(Math.cos(t))} ; ${ex(Math.sin(t))}).`);
}
function genCosSin(){
  const T = pick([[3, 4, 5, '4'], [4, 3, 5, '3'], [5, 12, 13, '12'], [12, 5, 13, '5'], [8, 15, 17, '15'], [7, 24, 25, '24'], [1, null, 3, '2√2'], [2, null, 3, '√5'], [1, null, 4, '√15'], [1, null, 5, '2√6']]);
  const [a, b0, b, oth] = T;
  const q = rnd(1, 4); // quadrant
  const cs = q === 1 || q === 4 ? 1 : -1, ss = q <= 2 ? 1 : -1;
  const I = { 1: `[0 ; ${pis(1, 2)}]`, 2: `[${pis(1, 2)} ; π]`, 3: `[−π ; −${pis(1, 2)}]`, 4: `[−${pis(1, 2)} ; 0]` }[q];
  const givenSin = Math.random() < .5, gs = givenSin ? ss : cs, ws = givenSin ? cs : ss;
  const sg = s => s < 0 ? '−' : '';
  const given = sg(gs) + F(a, b), ans = sg(ws) + F(oth, b);
  const sq = b * b - a * a;
  const cands = [sg(-ws) + F(oth, b), sg(ws) + F(b - a, b), sg(ws) + F(sq, b * b), sg(-ws) + F(b - a, b)];
  const g = givenSin ? 'sin' : 'cos', w = givenSin ? 'cos' : 'sin';
  return build(`On sait que <b>${g} x = ${given}</b> et x ∈ ${I}. Que vaut <b>${w} x</b> ?`, ans, cands,
    `${w}²x = 1 − ${g}²x = 1 − ${F(a * a, b * b)} = ${F(sq, b * b)}, donc ${w} x = ${F(oth, b)} ou −${F(oth, b)}. Sur ${I}, ${w} x est ${ws > 0 ? 'positif' : 'négatif'} : ${w} x = ${ans}.`);
}
function sols(f, v){ const r = []; for (let n = -11; n <= 12; n++) if (Math.abs(f(n * PI / 12) - v) < 1e-9) r.push(n); return r; }
const setStr = ns => ns.length ? `{ ${ns.map(tw).join(' ; ')} }` : '∅';
function genEq(){
  const isCos = Math.random() < .5, f = isCos ? cosF : sinF, g = isCos ? sinF : cosF;
  const v = pick(ALLV), S = sols(f, v);
  const cands = [setStr(sols(g, v)), setStr(sols(f, -v)), setStr([S[0]]), setStr(S.map(n => -n).sort((x, y) => x - y)),
    setStr(S.length === 1 ? [-S[0], S[0]].filter((x, i, a) => a.indexOf(x) === i && x > -12).sort((x, y) => x - y) : [S[1]]),
    ...ALLV.map(x => setStr(sols(f, x)))];
  const a = isCos ? Math.acos(v) : Math.asin(v), an = Math.round(a * 12 / PI);
  const rule = isCos ? `cos x = cos(${tw(an)}) ⇔ x = ${tw(an)} ou x = −${tw(an).replace(/^−/, '')}` : `sin x = sin(${tw(an)}) ⇔ x = ${tw(an)} ou x = π − (${tw(an)})`;
  return build(`Résoudre dans ]−π ; π] : <b>${isCos ? 'cos' : 'sin'} x = ${ex(v)}</b>`, setStr(S), cands,
    `${S.length === 1 ? `Un seul point du cercle a ${isCos ? 'pour abscisse' : 'pour ordonnée'} ${ex(v)}.` : `${rule.replace('−−', '')} (à 2π près), puis on ramène dans ]−π ; π].`} S = ${setStr(S)}.`);
}
const GENS = { conv: ['Conversions', genConv], princ: ['Mesure principale', genPrinc], val: ['Valeurs cos/sin', genVal], cs: ['cos ↔ sin', genCosSin], eq: ['Équations', genEq], mix: ['Tout mélangé', null] };
let tr = { type: store.get('type', 'mix'), ex: null, answered: false, ok: store.get('ok', 0), tot: store.get('tot', 0) };
function newEx(){
  const key = tr.type === 'mix' ? pick(['conv', 'princ', 'val', 'cs', 'eq']) : tr.type;
  tr.ex = GENS[key][1](); tr.ex.kind = GENS[key][0]; tr.answered = false;
}
function renderTrain(){
  if (!tr.ex) newEx();
  const it = tr.ex;
  $('#view').innerHTML = `
    <div class="row" style="margin-bottom:12px"><div class="seg">${Object.entries(GENS).map(([k, [l]]) => `<button data-k="${k}" aria-pressed="${tr.type === k}">${l}</button>`).join('')}</div></div>
    <div class="progress">${it.kind} · Réussis : ${tr.ok} / ${tr.tot} <button class="btn ghost small" id="rz" style="margin-left:8px;padding:2px 10px;font-size:12px">remettre à 0</button></div>
    <div class="card">
      <p class="qtxt">${it.q}</p>
      <div>${it.o.map((o, i) => `<button class="opt" data-i="${i}">${o}</button>`).join('')}</div>
      <div id="tfb"></div>
      <div class="row" style="justify-content:flex-end;margin-top:12px"><button class="btn" id="tn" ${tr.answered ? '' : 'disabled'}>Exercice suivant</button></div>
    </div>
    <p class="muted center" style="font-size:14px">Les exercices sont tirés au hasard : il y en a à l'infini. Cherche sur un brouillon avant de cliquer !</p>`;
  document.querySelectorAll('.seg button').forEach(b => b.onclick = () => { tr.type = b.dataset.k; store.set('type', tr.type); newEx(); renderTrain(); });
  $('#rz').onclick = () => { tr.ok = 0; tr.tot = 0; store.set('ok', 0); store.set('tot', 0); renderTrain(); };
  document.querySelectorAll('.opt').forEach(b => b.onclick = () => {
    if (tr.answered) return;
    tr.answered = true;
    const i = +b.dataset.i, ok = i === it.c;
    tr.tot++; if (ok) tr.ok++;
    store.set('ok', tr.ok); store.set('tot', tr.tot);
    document.querySelectorAll('.opt').forEach((x, j) => { x.disabled = true; if (j === it.c) x.classList.add('good'); else if (j === i) x.classList.add('bad'); });
    $('#tfb').innerHTML = `<div class="fb ${ok ? 'good' : 'bad'}"><b class="t">${ok ? 'Exact !' : 'Pas tout à fait.'}</b>${it.e}</div>`;
    $('#tn').disabled = false;
    document.querySelector('.progress').firstChild.textContent = `${it.kind} · Réussis : ${tr.ok} / ${tr.tot} `;
  });
  $('#tn').onclick = () => { newEx(); renderTrain(); };
}

/* ---------- onglets ---------- */
const VIEWS = { fiche: renderFiche, cercle: renderCercle, flash: renderFlash, quiz: renderQuiz, train: renderTrain };
function show(tab){
  if (!VIEWS[tab]) tab = 'fiche';
  document.querySelectorAll('.tab[data-tab]').forEach(t => t.setAttribute('aria-selected', t.dataset.tab === tab));
  store.set('tab', tab);
  VIEWS[tab]();
}
document.querySelectorAll('.tab[data-tab]').forEach(t => t.onclick = () => show(t.dataset.tab));
show(store.get('tab', 'fiche'));
</script>
</body>
